<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="description" content="QR-ready chemical product and SDS lookup for a single Sojo Industries location." />
    <title>Sojo Chemical Product Lookup</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="site.config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <noscript>This lookup requires JavaScript so it can read the latest spreadsheet.</noscript>
    <div id="app" class="app-shell">
      <section class="loading-card">
        <p class="eyebrow">Sojo Chemical Product Lookup</p>
        <h1>Loading latest SDS list...</h1>
        <p>The page checks the live spreadsheet every time it opens.</p>
      </section>
    </div>
  </body>
</html>
